<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interactivo - Obras Pasco</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="estilos.css">
</head>
<body class="mapa-fullscreen-body">

    <a href="index.html" class="btn-volver">
        <i class="fa-solid fa-arrow-left"></i> Volver al Panel
    </a>

    <div class="panel-filtros">
        <h3><i class="fa-solid fa-filter"></i> Buscar Obras</h3>
        
        <div class="grupo-filtro">
            <label>Nombre o Código SNIP</label>
            <input type="text" id="buscarTexto" placeholder="Ej. Colegio Chaupimarca...">
        </div>
        
        <div class="grupo-filtro">
            <label>Provincia</label>
            <select id="filtroProvincia">
                <option value="todas">Todas las provincias</option>
                <option value="PASCO">Pasco</option>
                <option value="OXAPAMPA">Oxapampa</option>
                <option value="DANIEL ALCIDES CARRION">Daniel Alcides Carrión</option>
            </select>
        </div>

        <div class="grupo-filtro">
            <label>Estado de Ejecución</label>
            <select id="filtroEstado">
                <option value="todos">Todos los estados</option>
                <option value="ejecucion">En Ejecución</option>
                <option value="paralizada">Paralizada</option>
                <option value="terminada">Terminada</option>
            </select>
        </div>
        
        <button id="btnFiltrar" class="btn-primary" style="width: 100%; margin-top: 10px;">Aplicar Filtros</button>
    </div>

    <div id="mi_mapa" class="mapa-fullscreen"></div>

    <div id="modalObras" class="modal-overlay">
        <div class="modal-contenido">
            <span class="modal-cerrar">&times;</span>
            <div class="modal-cabecera">
                <span id="modal-estado" class="etiqueta-estado">Estado</span>
                <h2 id="modal-titulo" class="texto-principal">Nombre de la obra</h2>
                <p id="modal-entidad" class="texto-secundario">Entidad Pública</p>
            </div>
            <div class="modal-cuerpo">
                <div class="dato-bloque">
                    <span class="dato-etiqueta">Avance Físico</span>
                    <span id="modal-avance" class="dato-valor resaltado">0%</span>
                </div>
                <div class="dato-bloque">
                    <span class="dato-etiqueta">Presupuesto Ejecutado</span>
                    <span id="modal-monto" class="dato-valor">S/ 0.00</span>
                </div>
                <div class="dato-bloque">
                    <span class="dato-etiqueta">Ubicación</span>
                    <span id="modal-ubicacion" class="dato-valor">Distrito, Provincia</span>
                </div>
                <div class="dato-bloque">
                    <span class="dato-etiqueta">Código SNIP</span>
                    <span id="modal-snip" class="dato-valor">000000</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="app.js"></script>
</body>
</html>
