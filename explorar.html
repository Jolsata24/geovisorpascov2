<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorar Obras - Pasco Transparente</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles/estilos_explorar.css">
    <!-- Tus Estilos -->
    <link rel="stylesheet" href="styles/estilos_main.css">
    <link rel="stylesheet" href="styles/menu.css">
    <link rel="icon" type="image/png" href="img/logo02.png">
</head>
<body class="bg-light">
    <div id="preloader">
        <div class="preloader-content">
            <img src="img/logo02.png" alt="Cargando Pasco Transparente" class="preloader-logo">
            <div class="spinner"></div>
        </div>
    </div>
    <!-- 1. BOTÓN HAMBURGUESA FLOTANTE (A la derecha) -->
    <button id="btn-menu" class="btn-hamburguesa">
        <span class="linea"></span>
        <span class="linea"></span>
        <span class="linea"></span>
    </button>

    <!-- 2. MENÚ LATERAL OCULTO (Entra por la derecha) -->
    <nav id="menu-lateral" class="menu-lateral">
        <ul class="lista-menu">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="mapa.html">Mapa</a></li>
            <li><a href="explorar.html">Explorar</a></li>
        </ul>
    </nav>
    <header class="header-global">
        <nav class="navbar">
            <a href="index.html" class="logo" style="text-decoration:none;">
    <img src="img/logo02.png" alt="Logo Pasco Transparente" class="logo-img">GeoVisor Pasco
</a>
            <ul class="nav-links-desktop">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="mapa.html">Mapa Interactivo</a></li>
                <li><a href="explorar.html">Explorar Obras</a></li>
            </ul>
        </nav>

        <div class="banner-hero">
            <img src="img/banner.jpg" alt="Fondo de obras" class="banner-bg">
            <div class="banner-overlay"></div>
            <div class="banner-content">
                <h1>Directorio de Proyectos</h1>
                <p>Busca y filtra el estado detallado de todas las obras públicas en la región.</p>
            </div>
        </div>
    </header>

    <main class="explorar-container">
        
        <aside class="filtros-sidebar">
            <h3><i class="fa-solid fa-sliders"></i> Filtros Avanzados</h3>
            
            <div class="grupo-filtro">
                <label>Año de Ejecución</label>
                <div class="select-wrapper">
                    <select id="filtroAnio">
                        <option value="todos">Todos los años</option>
                        <option value="2026">2026</option>
                        <option value="2025">2025</option>
                        <option value="2024">2024</option>
                        <option value="2023">2023</option>
                        <option value="2022">2022 y anteriores</option>
                    </select>
                </div>
            </div>

            <div class="grupo-filtro">
                <label>Buscar por Nombre o Entidad</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-magnifying-glass icon-left"></i>
                    <input type="text" id="filtroTexto" placeholder="Ej. Colegio Chaupimarca...">
                </div>
            </div>
            
            <div class="grupo-filtro">
                <label>Provincia</label>
                <div class="select-wrapper">
                    <select id="filtroProv">
                        <option value="todas">Todas las Provincias</option>
                        <option value="PASCO">Pasco</option>
                        <option value="OXAPAMPA">Oxapampa</option>
                        <option value="DANIEL ALCIDES CARRION">Daniel Alcides Carrión</option>
                    </select>
                </div>
            </div>

            <div class="grupo-filtro">
                <label>Estado del Proyecto</label>
                <div class="select-wrapper">
                    <select id="filtroEstadoObra">
                        <option value="todos">Todos los Estados</option>
                        <option value="ejecucion">En Ejecución / Contrata</option>
                        <option value="paralizada">Paralizada</option>
                        <option value="recepcion">Recepción / Terminada</option>
                    </select>
                </div>
            </div>



            <button id="btnLimpiarFiltros" class="btn-limpiar">
                <i class="fa-solid fa-rotate-right"></i> Limpiar Filtros
            </button>
        </aside>

        <section class="resultados-section">
            <div class="resultados-header">
                <h2 id="contadorResultados"><i class="fa-solid fa-circle-notch fa-spin"></i> Cargando directorio...</h2>
            </div>
            
            <div id="contenedorObras" class="obras-grid"></div>
            <div id="contenedorObras" class="obras-grid"></div>
            
            <div id="paginacionContainer" class="paginacion-container"></div>
        </section>

    </main>

    <script src="js/explorar.js"></script>
    <script src="js/menu.js"></script>
</body>
</html>
