<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Obra - Pasco Transparente</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles/estilos_detalle.css">
</head>
<body class="bg-light">

    <header class="navbar" style="background: var(--primary-dark); padding: 15px 5%;">
        <a href="index.html" class="logo" style="color: white; text-decoration:none;"><i class="fa-solid fa-shield-halved"></i> Pasco Transparente</a>
        <a href="explorar.html" style="color: white; text-decoration: none;"><i class="fa-solid fa-arrow-left"></i> Volver al Directorio</a>
    </header>

    <main class="detalle-container">
        
        <section class="detalle-resumen card">
            <span id="det-estado" class="etiqueta-estado">Cargando...</span>
            <h1 id="det-titulo" style="font-size: 1.4rem; color: var(--primary-dark); margin: 15px 0;">Cargando título de la obra...</h1>
            



            <div style="background: #f8fafc; padding: 15px; border-radius: 8px; font-size: 0.9rem; line-height: 1.6;">
                <strong><i class="fa-solid fa-location-dot"></i> Ubicación:</strong> <span id="det-ubicacion">...</span><br>
                <strong><i class="fa-solid fa-barcode"></i> Código SNIP:</strong> <span id="det-snip">...</span>
            </div>
        </section>

        <section class="detalle-ficha card" style="padding: 0; overflow: hidden;">
            <div style="background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%); color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <span style="display: block; font-size: 0.75rem; color: #fca5a5; font-weight: bold; letter-spacing: 1px;">CONTRALORÍA GENERAL DE LA REPÚBLICA</span>
                    <h3 style="margin: 0; font-size: 1.1rem;"><i class="fa-solid fa-camera-retro"></i> Ficha Oficial INFObras</h3>
                </div>
                <a id="link-infobras-externo" href="#" target="_blank" class="btn-outline" style="border-color: rgba(255,255,255,0.3); color: white; padding: 5px 15px; font-size: 0.85rem; display: none;">
                    Abrir en nueva pestaña <i class="fa-solid fa-external-link-alt ms-1"></i>
                </a>
            </div>
            
            <div style="flex-grow: 1; background: #f8fafc; position: relative;">
                <div id="mensaje-carga-iframe" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: #64748b;">
                    <i class="fa-solid fa-circle-notch fa-spin fa-2x mb-2"></i>
                    <p>Buscando expediente fotográfico...</p>
                </div>
                
                <iframe id="iframe-infobras" src="" width="100%" height="100%" style="border: none; min-height: 700px; position: relative; z-index: 10; display: none;"></iframe>
            </div>
        </section>

    </main>

    <script src="js/detalle.js?v=3"></script>
</body>
</html>
